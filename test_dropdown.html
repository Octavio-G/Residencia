<!DOCTYPE html>
<html>
<head>
    <title>Test Opciones Dropdown</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>Verificación de Opciones del Dropdown</h2>
        
        <div class="row">
            <div class="col-md-6">
                <label for="tipo_dato">Tipo de Dato:</label>
                <select class="form-control" id="tipo_dato" name="tipo_dato">
                    <option value="humedad">Humedad Promedio (Cama 1 y 2)</option>
                    <option value="humedad_cama1">Humedad Cama 1</option>
                    <option value="humedad_cama2">Humedad Cama 2</option>
                    <option value="consumo_agua">Consumo de Agua</option>
                    <option value="temperatura">Temperatura Ambiental</option>
                    <option value="humedad_ambiental">Humedad Ambiental</option>
                </select>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-md-12">
                <h4>Opciones disponibles:</h4>
                <ul id="lista-opciones">
                    <!-- Las opciones se listarán aquí -->
                </ul>
            </div>
        </div>
    </div>

    <script>
        // Listar todas las opciones del dropdown
        document.addEventListener('DOMContentLoaded', function() {
            const select = document.getElementById('tipo_dato');
            const lista = document.getElementById('lista-opciones');
            
            for (let i = 0; i < select.options.length; i++) {
                const option = select.options[i];
                const li = document.createElement('li');
                li.innerHTML = `<strong>${option.value}</strong>: ${option.text}`;
                lista.appendChild(li);
            }
            
            console.log('Total de opciones:', select.options.length);
        });
    </script>
</body>
</html>
